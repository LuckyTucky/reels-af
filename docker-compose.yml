services:
  control-plane:
    image: agentfield/control-plane:latest
    environment:
      AGENTFIELD_STORAGE_MODE: local
      AGENTFIELD_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "${AGENTFIELD_HTTP_PORT:-8080}:8080"
    volumes:
      - agentfield-data:/data
    # NOTE: agentfield/control-plane:latest is a distroless image — no sh,
    # no wget, no curl. A CMD-based healthcheck cannot run inside the
    # container. The agent SDK retries connection on startup, so
    # service_started is sufficient.

  reel-af:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGENTFIELD_SERVER: http://control-plane:8080
      AGENT_CALLBACK_URL: http://reel-af:8002
      AGENT_NODE_ID: ${AGENT_NODE_ID:-reel-af}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      REEL_AF_MODEL: ${REEL_AF_MODEL:-openrouter/deepseek/deepseek-v4-pro}
      # Advanced: point reasoning at any OpenAI-compatible endpoint. Empty
      # values are treated as unset and fall back to OpenRouter.
      REEL_AF_API_BASE: ${REEL_AF_API_BASE:-}
      REEL_AF_API_KEY: ${REEL_AF_API_KEY:-}
      REEL_AF_TTS_MODEL: ${REEL_AF_TTS_MODEL:-google/gemini-3.1-flash-tts-preview}
      REEL_AF_IMAGE_MODEL: ${REEL_AF_IMAGE_MODEL:-openrouter/google/gemini-2.5-flash-image}
      REEL_AF_VIDEO_MODEL: ${REEL_AF_VIDEO_MODEL:-openrouter/google/veo-3.1-lite}
      # Plan de fin (outro logo Bon Stock). Fond vide = auto (épouse le logo).
      REEL_AF_OUTRO_S: ${REEL_AF_OUTRO_S:-2.0}
      REEL_AF_OUTRO_BG: ${REEL_AF_OUTRO_BG:-}
      REEL_AF_LOGO: ${REEL_AF_LOGO:-}
      # Signature vocale de fin (« Bon Stock loves cannabis! »).
      REEL_AF_SIGNATURE: ${REEL_AF_SIGNATURE:-1}
      REEL_AF_SIGNATURE_TEXT: ${REEL_AF_SIGNATURE_TEXT:-}
      REEL_AF_SIGNATURE_VOICE: ${REEL_AF_SIGNATURE_VOICE:-Aoede}
      REEL_AF_SIGNATURE_BG_VOLUME: ${REEL_AF_SIGNATURE_BG_VOLUME:-0.35}
      # Intro/outro vidéo Envato (clips piochés au hasard dans bon-stock/intro
      # et bon-stock/outro). Indicatif joué au début et à la fin.
      REEL_AF_INTRO: ${REEL_AF_INTRO:-1}
      REEL_AF_INTRO_MAX_S: ${REEL_AF_INTRO_MAX_S:-6}
      REEL_AF_INTRO_BG_VOLUME: ${REEL_AF_INTRO_BG_VOLUME:-0.8}
      REEL_AF_OUTRO_VIDEO: ${REEL_AF_OUTRO_VIDEO:-1}
      # Transitions entre plans : fondus xfade aléatoires (liste séparée par des
      # virgules). « none » = coupes franches. Durée du fondu en secondes.
      REEL_AF_TRANSITIONS: ${REEL_AF_TRANSITIONS:-fade,dissolve,distance,pixelize}
      REEL_AF_TRANSITION_S: ${REEL_AF_TRANSITION_S:-0.3}
      PORT: ${PORT:-8002}
    ports:
      - "${AGENT_NODE_PORT:-8002}:8002"
    depends_on:
      control-plane:
        condition: service_started
    volumes:
      # Rendered reels and intermediates survive container rebuilds.
      - ./output:/app/output
      # Marque Bon Stock EN DIRECT (logo, indicatif, signature, intro/, outro/).
      # Monté → changer/ajouter un clip ne nécessite PAS de reconstruction,
      # juste `docker compose up -d reel-af`. Les gros clips vidéo ne gonflent
      # pas l'image (voir .dockerignore).
      - ./bon-stock:/app/bon-stock:ro
    restart: on-failure

volumes:
  agentfield-data:
