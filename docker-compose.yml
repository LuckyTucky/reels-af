services:
  control-plane:
    image: agentfield/control-plane:latest
    environment:
      AGENTFIELD_STORAGE_MODE: local
      AGENTFIELD_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "${AGENTFIELD_HTTP_PORT:-8080}:8080"
    volumes:
      - agentfield-data:/data
    # NOTE: agentfield/control-plane:latest is a distroless image — no sh,
    # no wget, no curl. A CMD-based healthcheck cannot run inside the
    # container. The agent SDK retries connection on startup, so
    # service_started is sufficient.
    #
    # `unless-stopped` (not `on-failure`): this container has been observed
    # exiting cleanly (exit code 0, not a crash) on its own — e.g. after
    # Docker Desktop itself restarts — which `on-failure` would NOT catch
    # (it only restarts on non-zero exit). Without any restart policy the
    # reels-af engine silently goes dark until someone notices and runs
    # `docker compose up -d` by hand.
    restart: unless-stopped

  reel-af:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Structural/networking only — genuinely owned by compose. Every
      # user-tunable REEL_AF_* knob lives in .env, which docker-compose.
      # override.yml mounts live into /app/.env and app.py loads via
      # load_dotenv() at process start.
      #
      # Why they were REMOVED from here (2026-07-05): declaring them here
      # too — even with `${VAR:-default}` — bakes a fixed value into the
      # container AT CREATION TIME. `docker compose restart` does not
      # re-evaluate that substitution, so a later `.env` edit is silently
      # ignored until the container is fully recreated (`up -d
      # --force-recreate`) — python-dotenv's load_dotenv() also does not
      # override an already-set env var by default, so the stale
      # compose-baked value always won. This bit us for
      # REEL_AF_INTRO_MAX_S: edited .env, restarted, saw zero change.
      AGENTFIELD_SERVER: http://control-plane:8080
      AGENT_CALLBACK_URL: http://reel-af:8002
      AGENT_NODE_ID: ${AGENT_NODE_ID:-reel-af}
      PORT: ${PORT:-8002}
    ports:
      - "${AGENT_NODE_PORT:-8002}:8002"
    depends_on:
      control-plane:
        condition: service_started
    volumes:
      # Rendered reels and intermediates survive container rebuilds.
      - ./output:/app/output
      # Marque Bon Stock EN DIRECT (logo, indicatif, signature, intro/, outro/).
      # Monté → changer/ajouter un clip ne nécessite PAS de reconstruction,
      # juste `docker compose up -d reel-af`. Les gros clips vidéo ne gonflent
      # pas l'image (voir .dockerignore).
      - ./bon-stock:/app/bon-stock:ro
    restart: on-failure

volumes:
  agentfield-data:
