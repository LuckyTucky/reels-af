<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bon Stock — Texte → reel</title>
<style>
  :root{
    --bg:#12100e; --card:#1c1a17; --card2:#232019; --line:#332f28;
    --ink:#f2ede3; --mut:#a8a294; --acc:#5dcaa5; --acc-ink:#0f6e56;
    --acc-bg:#12332a; --rad:10px;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px 16px 48px}
  .wrap{max-width:760px; margin:0 auto}
  h1{font-size:20px; font-weight:600; margin:0 0 2px; display:flex; align-items:center; gap:9px}
  .sub{color:var(--mut); font-size:13px; margin:0 0 20px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px}
  label.fld{display:block; font-size:13px; font-weight:600; margin:0 0 8px}
  textarea{width:100%; min-height:130px; resize:vertical; background:var(--card2);
    color:var(--ink); border:1px solid var(--line); border-radius:var(--rad);
    padding:12px; font:inherit}
  textarea:focus{outline:none; border-color:var(--acc)}
  .section{margin-top:22px}
  .opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px}
  .opt{display:flex; gap:10px; padding:12px 14px; border:1px solid var(--line);
    border-radius:var(--rad); cursor:pointer; background:var(--card2)}
  .opt input{margin-top:3px; accent-color:var(--acc)}
  .opt.sel{border-color:var(--acc); background:var(--acc-bg)}
  .opt .t{font-size:14px; font-weight:600}
  .opt .d{font-size:12px; color:var(--mut)}
  .row{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .lang button{background:var(--card2); color:var(--mut); border:1px solid var(--line);
    border-radius:20px; padding:6px 16px; cursor:pointer; font:inherit; font-size:13px}
  .lang button.on{background:var(--acc-bg); color:var(--acc); border-color:var(--acc)}
  .head{display:flex; align-items:center; margin:0 0 12px}
  .head .n{margin-left:auto; font-size:12px; color:var(--mut)}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
  .st{border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer;
    background:var(--card2); position:relative; transition:border-color .12s}
  .st.sel{border-color:var(--acc); border-width:2px}
  .st .thumb{height:84px; display:flex; background-size:cover; background-position:center}
  .st .thumb i{flex:1}
  .st .chk{position:absolute; top:7px; right:7px; width:22px; height:22px; border-radius:50%;
    background:var(--acc); color:#08211a; display:none; align-items:center; justify-content:center;
    font-size:14px; font-weight:700}
  .st.sel .chk{display:flex}
  .st .cap{padding:8px 10px}
  .st .cap .caprow{display:flex; align-items:center; gap:6px}
  .st .cap .num{font-size:11px; color:var(--mut)}
  .st .cap .nom{font-size:12px; font-weight:600}
  .st .cap .bon{font-size:11px; color:var(--mut); margin-top:2px; line-height:1.35}
  .mb-upload{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .mb-upload input[type=text]{flex:1; min-width:160px; background:var(--card2);
    color:var(--ink); border:1px solid var(--line); border-radius:var(--rad);
    padding:9px 12px; font:inherit}
  .mb-upload input[type=file]{color:var(--mut); font-size:13px}
  .mb-upload button{background:var(--card2); color:var(--acc); border:1px solid var(--acc);
    border-radius:var(--rad); padding:9px 16px; font:inherit; font-size:13px; font-weight:600; cursor:pointer}
  .mb-upload button:disabled{opacity:.45; cursor:not-allowed}
  .go{margin-top:22px; width:100%; height:46px; border:none; border-radius:var(--rad);
    background:var(--acc); color:#08211a; font:inherit; font-size:15px; font-weight:700; cursor:pointer}
  .go:disabled{opacity:.45; cursor:not-allowed}
  .hint{font-size:12px; color:var(--mut); text-align:center; margin:10px 0 0}
  #log{margin-top:18px; font-size:13px}
  #log .l{padding:8px 12px; border:1px solid var(--line); border-radius:var(--rad);
    background:var(--card2); margin-bottom:8px}
  #log a{color:var(--acc)}
  .warn{color:#e0a44b}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Texte → reel <span style="font-size:13px;font-weight:400;color:var(--mut)">· Bon Stock</span></h1>
  <p class="sub">Colle ta nouvelle, choisis le mode et un ou plusieurs styles. Un reel par style.</p>

  <div class="card">
    <label class="fld" for="txt">Ton texte</label>
    <textarea id="txt" placeholder="Colle ici le texte de ta nouvelle…"></textarea>

    <div class="section">
      <label class="fld">Ce texte, c'est…</label>
      <div class="opts">
        <label class="opt sel" id="opt-brute">
          <input type="radio" name="mode" value="brute" checked>
          <span><span class="t">De la matière brute</span><br>
          <span class="d">Bon Stock rédige l'accroche et le script.</span></span>
        </label>
        <label class="opt" id="opt-verbatim">
          <input type="radio" name="mode" value="verbatim">
          <span><span class="t">Les mots exacts à dire</span><br>
          <span class="d">La narration lit ton texte tel quel.</span></span>
        </label>
      </div>
    </div>

    <div class="section row">
      <label class="fld" style="margin:0">Langue</label>
      <div class="lang" id="lang">
        <button data-l="fr" class="on">Français</button>
        <button data-l="en">English</button>
      </div>
    </div>

    <div class="section">
      <div class="head">
        <label class="fld" style="margin:0">Choisis un ou plusieurs styles</label>
        <span class="n" id="count">0 sélectionné</span>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="section">
      <label class="fld">+ Nouveau style depuis un mood board</label>
      <div class="mb-upload">
        <input type="text" id="mb-nom" placeholder="Nom du style (optionnel)">
        <input type="file" id="mb-files" multiple accept="image/*">
        <button id="mb-go" type="button">Distiller le style</button>
      </div>
      <p class="hint" id="mb-status"></p>
    </div>

    <div class="section">
      <label class="fld">Voix</label>
      <div class="opts" id="voices"></div>
    </div>

    <button class="go" id="go" disabled>Faire les reels</button>
    <p class="hint">Le moteur rend un reel à la fois. Suivi en direct : <a href="http://localhost:8090/ui/" target="_blank">http://localhost:8090/ui/</a></p>
    <div id="log"></div>
  </div>
</div>

<script>
// Styles + voix viennent de /api/reel-af/presets (source unique côté
// Python : render/images.STYLE_UI_META, render/tts.VOICE_PRESETS). Ajouter
// un style ou une voix là-bas suffit — cette page ne code plus rien en dur.
let lang = "fr";
let voicePreset = "voice1";
let voicesLoaded = false;
const selected = new Set();

async function loadPresets(){
  const grid = document.getElementById('grid');
  const voices = document.getElementById('voices');
  grid.innerHTML = '';
  try{
    const r = await fetch('/api/reel-af/presets');
    const { styles, voices: voiceList } = await r.json();

    styles.forEach(s => {
      const el = document.createElement('div');
      el.className = 'st' + (selected.has(s.id) ? ' sel' : '');
      el.dataset.id = s.id;
      el.title = s.desc;
      const thumbUrl = s.thumb || `styles/${s.id}.jpg`;
      const badge = s.id.startsWith('mb-') ? '🎨' : s.id.replace('style','');
      el.innerHTML =
        `<div class="thumb" style="background-image:url('${thumbUrl}')"></div>
         <div class="chk">✓</div>
         <div class="cap">
           <div class="caprow"><span class="num">${badge}</span><span class="nom">${s.nom}</span></div>
           <div class="bon">${s.bon}</div>
         </div>`;
      if(!s.thumb){
        // la vraie photo d'exemple s'affiche par défaut ; les bandes de
        // couleur ne sont injectées QUE si elle échoue à charger (repli),
        // jamais par-dessus une photo qui existe. Un style custom fournit
        // toujours s.thumb (collage généré), jamais besoin de ce repli.
        const img = new Image();
        img.onerror = () => {
          const bands = (s.pal || []).map(c => `<i style="background:${c}"></i>`).join('');
          const thumb = el.querySelector('.thumb');
          thumb.style.backgroundImage = 'none';
          thumb.innerHTML = bands;
        };
        img.src = thumbUrl;
      }
      el.onclick = () => {
        el.classList.toggle('sel');
        el.classList.contains('sel') ? selected.add(s.id) : selected.delete(s.id);
        refresh();
      };
      grid.appendChild(el);
    });

    if(!voicesLoaded){
      voicesLoaded = true;
      voiceList.forEach((v, i) => {
        const el = document.createElement('label');
        el.className = 'opt' + (v.id === voicePreset ? ' sel' : '');
        el.innerHTML =
          `<input type="radio" name="voice" value="${v.id}" ${v.id === voicePreset ? 'checked' : ''}>
           <span><span class="t">${v.label}${i===0 ? ' (actuelle)' : ''}</span><br>
           <span class="d">${v.gender === 'F' ? 'Femme' : 'Homme'}</span></span>`;
        el.querySelector('input').onchange = () => {
          voicePreset = v.id;
          document.querySelectorAll('#voices .opt').forEach(o => o.classList.remove('sel'));
          el.classList.add('sel');
        };
        voices.appendChild(el);
      });
    }
  }catch(err){
    grid.innerHTML = '<p class="hint">Impossible de charger les styles/voix — vérifie que le moteur tourne.</p>';
  }
}
loadPresets();

document.getElementById('mb-go').onclick = async () => {
  const files = document.getElementById('mb-files').files;
  const status = document.getElementById('mb-status');
  const btn = document.getElementById('mb-go');
  if(!files.length){ status.textContent = 'Choisis au moins une image.'; return; }
  const fd = new FormData();
  const nom = document.getElementById('mb-nom').value.trim();
  if(nom) fd.append('nom', nom);
  [...files].forEach(f => fd.append('images', f));
  btn.disabled = true;
  status.textContent = 'Distillation en cours… (quelques secondes)';
  try{
    const r = await fetch('/api/reel-af/moodboard', { method: 'POST', body: fd });
    const data = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(data.error || `échec (${r.status})`);
    status.textContent = `Style « ${data.nom} » créé ✓ — sélectionnable dans la grille ci-dessus.`;
    document.getElementById('mb-files').value = '';
    document.getElementById('mb-nom').value = '';
    await loadPresets();
  }catch(err){
    status.innerHTML = `<span class="warn">Échec</span> — ${err.message}`;
  }finally{
    btn.disabled = false;
  }
};

document.getElementById('lang').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  lang = b.dataset.l;
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
};
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => {
  document.getElementById('opt-brute').classList.toggle('sel', r.value==='brute' ? r.checked : !r.checked);
  document.getElementById('opt-verbatim').classList.toggle('sel', document.querySelector('input[name=mode]:checked').value==='verbatim');
});
const txt = document.getElementById('txt');
txt.oninput = refresh;

function refresh(){
  const c = selected.size;
  document.getElementById('count').textContent = c + ' sélectionné' + (c>1?'s':'');
  const go = document.getElementById('go');
  go.disabled = txt.value.trim().length < 10;
  go.textContent = c ? `Faire ${c} reel${c>1?'s':''}` : 'Faire le reel (style par défaut)';
}

document.getElementById('go').onclick = async () => {
  const text = txt.value.trim();
  if(text.length < 10) return;
  const mode = document.querySelector('input[name=mode]:checked').value;
  const styles = selected.size ? [...selected] : [''];
  const log = document.getElementById('log');
  log.innerHTML = '';
  for(const art_style of styles){
    const line = document.createElement('div');
    line.className = 'l';
    line.textContent = `Envoi… ${art_style || 'style par défaut'}`;
    log.appendChild(line);
    try{
      const r = await fetch('/api/reel-af/execute/reel_text_to_reel', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ input:{ text, art_style, mode, lang, voice_preset: voicePreset } })
      });
      const data = await r.json().catch(()=>({}));
      const id = data.execution_id || data.id || '';
      line.innerHTML = `Lancé — ${art_style || 'défaut'} ${id?('· <code>'+id+'</code>'):''} · suivi : <a href="http://localhost:8090/ui/" target="_blank">http://localhost:8090/ui/</a>`;
    }catch(err){
      line.innerHTML = `<span class="warn">Échec ${art_style||'défaut'}</span> — vérifie que le moteur (reel-af, port 8092) tourne.`;
    }
  }
};
refresh();
</script>
</body>
</html>
